name: kws_dpu
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10.14
  - pip=24.0
  - numpy=1.26.4
  - scipy=1.13.0
  - matplotlib=3.8.4
  - pandas=2.2.1
  - jupyter=1.0.0
  - ipykernel=6.29.4
  - tqdm=4.66.2
  - pip:
    # PyTorch (CPU build — GPU not needed for laptop dev)
    - torch==2.3.0
    - torchaudio==2.3.0
    - torchvision==0.18.0
    # Audio
    - librosa==0.10.2
    - soundfile==0.12.1
    # ONNX
    - onnx==1.16.1
    - onnxruntime==1.18.0
    - onnxsim==0.4.36
    # Evaluation / plotting
    - scikit-learn==1.5.0
    - seaborn==0.13.2
    - tabulate==0.9.0
    # Quantization helpers (laptop-side, before Vitis AI Docker)
    - pytorch-quantization==2.1.3
    # Utilities
    - pytest==8.2.0
    - black==24.4.2
    - isort==5.13.2
